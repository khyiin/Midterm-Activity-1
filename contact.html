<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Havena</title>
    <meta name="description" content="Get in touch with Havena and discover newsletter updates.">
    <meta property="og:title" content="Contact — Havena">
    <meta property="og:description" content="Get in touch with Havena and discover newsletter updates.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/pages/contact.css">
    <script defer src="js/catalog.js"></script>
    <script defer src="js/main.js"></script>
  </head>
  <body data-page="contact">
    <div class="havena-site">
      <header class="site-header">
        <a aria-label="Havena home" class="wordmark" href="index.html">havena</a>
        <nav aria-label="Main navigation" class="desktop-nav">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="shop.html">Shop</a>
          <a class="nav-link" href="about.html">About</a>
          <a aria-current="page" class="nav-link" href="contact.html">Contact</a>
        </nav>
        <div class="header-actions">
          <button aria-label="Search products" class="header-action" data-search-open="">
            <svg aria-hidden="true" class="" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
              <path d="m21 21-4.34-4.34"></path>
              <circle cx="11" cy="11" r="8"></circle>
            </svg>
            <span>Search</span>
          </button>
          <a aria-label="Cart, 0 items" class="header-action" data-cart-link="" href="cart.html">
            <svg aria-hidden="true" class="" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 10a4 4 0 0 1-8 0"></path>
              <path d="M3.103 6.034h17.794"></path>
              <path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"></path>
            </svg>
            <span>Cart</span>
          </a>
          <button aria-expanded="false" aria-label="Open menu" class="mobile-toggle">
            <svg aria-hidden="true" class="" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 5h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 19h16"></path>
            </svg>
          </button>
        </div>
        <nav aria-label="Mobile navigation" class="mobile-nav" hidden="">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="shop.html">Shop</a>
          <a class="nav-link" href="about.html">About</a>
          <a aria-current="page" class="nav-link" href="contact.html">Contact</a>
        </nav>
      </header>
      <main>
        <div class="page-heading">
          <h1>Contact Havena</h1>
          <p>We’d love to hear from you.</p>
        </div>
        <div class="page-content contact-layout">
          <form class="contact-form" novalidate="">
            <label class="form-field">Name
              <input name="name" autocomplete="name" required="">
            </label>
            <label class="form-field">Email Address
              <input name="email" type="email" autocomplete="email" required="">
            </label>
            <label class="form-field">Message
              <textarea name="message" required=""></textarea>
            </label>
            <button type="submit" class="store-button">Send Message</button>
            <p class="status" role="status"></p>
          </form>
          <section aria-labelledby="newsletter-title" class="newsletter-section contact-newsletter" id="contact">
            <h2 id="newsletter-title">Join Our Newsletter</h2>
            <p>Sign up for exclusive offers &amp; updates.</p>
            <form class="newsletter-form" novalidate="">
              <input aria-label="Email Address" autocomplete="email" placeholder="Email Address" required="" type="email" value="">
              <button class="store-button" type="submit">Subscribe</button>
            </form>
          </section>
        </div>
      </main>
    </div>
    <dialog id="shop-dialog" class="shop-modal" aria-labelledby="modal-title">
      <button class="modal-close" aria-label="Close dialog">×</button>
      <h2 class="modal-title" id="modal-title"></h2>
      <div id="modal-content"></div>
    </dialog>
  </body>
</html>
